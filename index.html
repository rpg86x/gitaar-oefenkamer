<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gitaar Oefenkamer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700&family=Shrikhand&display=swap" rel="stylesheet">
<style>
/* Layout: links het instrument (gitaarkeuze, aanslaan, ritme), rechts het akkoord dat je leert; daaronder de akkoordenbibliotheek per stap. */
:root{
  --bg:#eceff5; --surface:#ffffff; --ink:#1a2340; --muted:#5d6785; --line:#d2d8e6;
  --accent:#c4412a; --accent-ink:#ffffff; --sun:#e9a91f;
  --display:"Shrikhand","Georgia",serif; --body:"Karla","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10152a; --surface:#1a2140; --ink:#e9ecf6; --muted:#9aa4c4; --line:#2e3760;
    --accent:#ff7a5c; --accent-ink:#2b0c05; --sun:#f3bd45; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10152a; --surface:#1a2140; --ink:#e9ecf6; --muted:#9aa4c4; --line:#2e3760;
  --accent:#ff7a5c; --accent-ink:#2b0c05; --sun:#f3bd45; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,5vw,40px);margin:0;letter-spacing:.01em;line-height:1.05}
h1 .acc{color:var(--accent)}
h1 small{font-family:var(--body);font-size:13px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;vertical-align:middle;margin-left:6px;letter-spacing:0}
.hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lang{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;padding:5px 12px;font-weight:700;font-size:13px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
header p{margin:0;color:var(--muted);font-size:14px}
kbd{font-family:var(--body);font-size:12px;font-weight:700;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface)}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px}
h2{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:700}

/* gitaarkeuze */
.guitars{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:8px}
@media (max-width:520px){.guitars{grid-template-columns:1fr 1fr}}
.gtr{border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:1px;min-width:0}
.gtr b{font-size:15px}
.gtr span{font-size:12px;color:var(--muted)}
.gtr[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.gtr[aria-pressed="true"] span{color:inherit;opacity:.85}

.quick{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:8px 16px;font-weight:700;font-size:17px;min-width:58px;transition:transform .08s}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip small{font-weight:500;font-size:11px;opacity:.7;margin-left:6px}

/* het instrument */
.pad{position:relative;height:330px;border-radius:14px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:ns-resize;--s-treble:#f6efdc;--s-bass:#c9ccd2}
.pad.klassiek{background:repeating-linear-gradient(91deg,rgba(70,30,5,.08) 0 2px,transparent 2px 8px),linear-gradient(160deg,#d59a5c,#b06f33)}
.pad.western{background:repeating-linear-gradient(91deg,rgba(90,60,10,.07) 0 1px,transparent 1px 6px),linear-gradient(160deg,#ecc98a,#d3a257);--s-treble:#e9e2d0;--s-bass:#c79a55}
.pad.clean{background:radial-gradient(ellipse at 50% 50%,#f0b23c 0%,#c9571d 55%,#3a1408 100%);--s-treble:#e8eaee;--s-bass:#bfc3ca}
.pad.crunch{background:linear-gradient(160deg,#2b2f3a,#0e1016);--s-treble:#e8eaee;--s-bass:#bfc3ca}
.hole{position:absolute;left:50%;top:50%;width:210px;height:210px;margin:-105px 0 0 -105px;border-radius:50%;background:#24150b;
  box-shadow:0 0 0 4px rgba(255,236,200,.35),0 0 0 9px rgba(60,30,5,.45),0 0 0 13px rgba(255,236,200,.3),0 0 0 15px rgba(60,30,5,.35),inset 0 6px 18px rgba(0,0,0,.6)}
.pad.western .hole{box-shadow:0 0 0 5px rgba(40,20,5,.7),0 0 0 9px rgba(255,240,210,.5),inset 0 6px 18px rgba(0,0,0,.6)}
.pickup{position:absolute;top:8%;bottom:8%;width:34px;border-radius:9px;background:#15171c;box-shadow:0 0 0 3px #c9ccd2, inset 0 0 0 5px #24272e;display:none}
.pickup.a{left:32%}.pickup.b{left:62%}
.pad.clean .hole,.pad.crunch .hole{display:none}
.pad.clean .pickup,.pad.crunch .pickup{display:block}
.string{position:absolute;left:0;right:0;height:28px;margin-top:-14px;display:flex;align-items:center;pointer-events:none}
.string i{display:block;flex:1;background:var(--s-treble);border-radius:2px;box-shadow:0 2px 3px rgba(0,0,0,.4)}
.string.bass i{background:repeating-linear-gradient(90deg,var(--s-bass) 0 2px,rgba(0,0,0,.25) 2px 3px)}
.string b{width:50px;text-align:center;font-weight:700;color:#fff8ea;text-shadow:0 1px 3px rgba(0,0,0,.7);font-size:15px}
.string em{width:62px;text-align:center;font-style:normal;font-size:12px;color:#fff8ea;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.string.mute i{opacity:.3}
.string.mute b{opacity:.5}
.string.ring i{animation:vib .5s ease-out}
@keyframes vib{0%{transform:translateY(-3px)}20%{transform:translateY(3px)}40%{transform:translateY(-2px)}60%{transform:translateY(2px)}80%{transform:translateY(-1px)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.string.ring i{animation:none;opacity:.6}}
.padhint{margin:-6px 0 0;font-size:13px;color:var(--muted)}
.strums{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.strum{border:0;border-radius:14px;padding:14px 10px;background:var(--ink);color:var(--bg);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .07s, background .1s}
.strum .arr{font-size:24px;line-height:1}
.strum:active,.strum.hit{transform:scale(.97);background:var(--accent);color:var(--accent-ink)}

/* ritme */
.steps{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.step{border:1.5px solid var(--line);border-radius:10px;padding:6px 0 4px;text-align:center;display:flex;flex-direction:column}
.step .a{font-size:20px;font-weight:700;line-height:1.1}
.step .n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.step.rest .a{color:var(--line)}
.step.on{background:var(--sun);border-color:var(--sun);color:#2a1a05}
.step.on .n{color:#2a1a05}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pats{display:flex;gap:6px;flex-wrap:wrap}
.pat{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:7px 11px;font-size:14px;font-weight:500}
.pat[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.play{border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:11px 22px;font-size:16px;min-width:120px}
.tempo{display:flex;align-items:center;gap:10px;flex:1;min-width:200px}
.tempo input{flex:1;accent-color:var(--accent);min-width:90px}
.tempo output{font-weight:700;font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
label.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
label.check input{accent-color:var(--accent);width:17px;height:17px}

/* akkoord leren */
.learn{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:start}
@media (max-width:460px){.learn{grid-template-columns:1fr;justify-items:center;text-align:center}}
.cname{font-family:var(--display);font-size:60px;line-height:1;margin:0;color:var(--accent)}
.cfull{margin:2px 0 8px;color:var(--muted);font-size:14px}
.notes{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
@media (max-width:460px){.notes{justify-content:center}}
.note{border:1px solid var(--line);border-radius:8px;padding:2px 7px;font-size:13px}
.note b{color:var(--muted);font-weight:500;margin-right:4px}
.tip{margin:0;font-size:15px;max-width:38ch}
svg.dia{width:190px;height:auto;display:block}
.dia .grid-l{stroke:var(--ink);stroke-width:2;opacity:.55}
.dia .nut{stroke:var(--ink);stroke-width:7;stroke-linecap:round}
.dia .dot{fill:var(--accent)}
.dia .barre{fill:var(--accent);opacity:.45}
.dia .fn{fill:var(--accent-ink);font:700 14px var(--body);text-anchor:middle;dominant-baseline:central}
.dia .open{fill:none;stroke:var(--ink);stroke-width:2}
.dia .x{stroke:var(--muted);stroke-width:2.5;stroke-linecap:round}
.dia .lbl{fill:var(--muted);font:700 13px var(--body);text-anchor:middle}
.dia .fr{fill:var(--muted);font:500 11px var(--body);text-anchor:end;dominant-baseline:central}
.legend{font-size:13px;color:var(--muted);margin:0}

.progs{display:flex;flex-direction:column;gap:6px}
.prog{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:9px 12px;text-align:left}
.prog b{font-size:16px;white-space:nowrap}
.prog span{font-size:13px;color:var(--muted);text-align:right}
.progs .sub{margin:8px 0 0;font-size:13px;font-weight:700;color:var(--muted)}
.prog[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

.foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.donate{display:inline-block;border:1.5px solid var(--accent);color:var(--accent);border-radius:999px;padding:8px 16px;font-weight:700;text-decoration:none}
.donate:hover{background:var(--accent);color:var(--accent-ink)}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.level h3{margin:0 0 2px;font-size:16px}
.level p{margin:0 0 8px;font-size:13px;color:var(--muted)}
.level .quick .chip{font-size:15px;padding:6px 12px;min-width:50px}

/* het gat schaalt mee met de hoogte van het instrument */
.hole{width:auto;height:64%;aspect-ratio:1;margin:0;transform:translate(-50%,-50%)}
body{touch-action:manipulation}
/* Tablet en desktop: links staat het instrument vast, alleen de rechterkant scrolt. */
@media (min-width:820px) and (min-height:560px){
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  .wrap{height:100%;max-width:1500px;padding:12px 16px;gap:12px}
  header{flex:none}
  h1{font-size:30px}
  .grid{flex:1;min-height:0;align-items:stretch}
  .col{min-height:0}
  .col.left{overflow:hidden;touch-action:none}
  .col.left .inst{flex:1;min-height:0;padding:14px;gap:10px}
  .col.left .tempo input{touch-action:pan-x}
  .pad{height:auto;flex:1 1 0;min-height:110px}
  .col.right{overflow-y:auto;overscroll-behavior:contain;padding-right:6px;padding-bottom:12px}
}
@media (min-width:820px) and (min-height:560px) and (pointer:coarse){
  .hd p{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span id="t1"></span> <span id="t2" class="acc"></span><small>1.2</small></h1>
    <div class="hd">
      <p data-t="keys"></p>
      <div class="lang" role="group" aria-label="Taal / Language"><button type="button" data-lang="nl">NL</button><button type="button" data-lang="en">EN</button></div>
    </div>
  </header>

  <div class="grid">
    <div class="col left">
      <section class="card inst">
        <h2 data-t="hSeq"></h2>
        <div class="quick" id="quick"></div>
        <div class="pad klassiek" id="pad">
          <div class="hole"></div><div class="pickup a"></div><div class="pickup b"></div>
        </div>
        <p class="padhint" data-t="padHint"></p>
        <div class="strums">
          <button class="strum" id="btnDown" type="button"><span class="arr">↓</span> <span data-t="down"></span></button>
          <button class="strum" id="btnUp" type="button"><span class="arr">↑</span> <span data-t="up"></span></button>
        </div>
        <div class="steps" id="steps"></div>
        <div class="row">
          <button class="play" id="play" type="button"></button>
          <div class="tempo">
            <label for="bpm">Tempo</label>
            <input id="bpm" type="range" min="50" max="140" step="1" value="80">
            <output id="bpmOut" for="bpm">80 bpm</output>
          </div>
        </div>
      </section>
    </div>

    <div class="col right">
      <section class="card">
        <h2 data-t="hLearn"></h2>
        <div class="learn">
          <div id="dia"></div>
          <div>
            <p class="cname" id="cname"></p>
            <p class="cfull" id="cfull"></p>
            <div class="notes" id="notes"></div>
            <p class="tip" id="tip"></p>
          </div>
        </div>
        <p class="legend" data-t="legend"></p>
      </section>

      <section class="card">
        <h2 data-t="hGuitar"></h2>
        <div class="guitars" id="guitars"></div>
      </section>

      <section class="card">
        <h2 data-t="hProgs"></h2>
        <div class="progs" id="progs"></div>
      </section>

      <section class="card">
        <h2 data-t="hPat"></h2>
        <div class="pats" id="pats"></div>
        <label class="check" for="autoSwitch"><input id="autoSwitch" type="checkbox" checked> <span data-t="autoSwitch"></span></label>
      </section>

      <section class="card">
        <h2 data-t="hLevels"></h2>
        <div class="levels" id="levels"></div>
      </section>

      <footer class="foot"><span data-t="donateLead"></span><a class="donate" href="https://urbantechmonk.gumroad.com/coffee" target="_blank" rel="noopener" data-t="donate"></a></footer>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
var NS=6;

var SNAMES=["E","A","D","G","B","e"];
var NN=["C","C♯","D","E♭","E","F","F♯","G","A♭","A","B♭","B"];
var X=-1;
var CH={
  "Em":{full:{nl:"E mineur",en:"E minor"},f:[0, 2, 2, 0, 0, 0],g:[0, 2, 3, 0, 0, 0],tip:{nl:"Twee vingers naast elkaar in het tweede vakje en alle zes de snaren mogen klinken. Het makkelijkste begin.",en:"Two fingers side by side on the second fret, and all six strings may ring. The easiest start."}},
  "E":{full:{nl:"E majeur",en:"E major"},f:[0, 2, 2, 1, 0, 0],g:[0, 2, 3, 1, 0, 0],tip:{nl:"Em plus je wijsvinger op het eerste vakje van de G-snaar. Vol en stevig, alle snaren doen mee.",en:"Em plus your index finger on the first fret of the G string. Full and solid, every string joins in."}},
  "Am":{full:{nl:"A mineur",en:"A minor"},f:[X, 0, 2, 2, 1, 0],g:[0, 0, 2, 3, 1, 0],tip:{nl:"Dezelfde vorm als E, maar alles één snaar lager. De dikste snaar sla je niet aan.",en:"The same shape as E, but everything one string lower. Leave out the thickest string."}},
  "A":{full:{nl:"A majeur",en:"A major"},f:[X, 0, 2, 2, 2, 0],g:[0, 0, 1, 2, 3, 0],tip:{nl:"Drie vingers op een rij in het tweede vakje. Op een klassieke gitaar is daar gelukkig ruimte voor.",en:"Three fingers in a row on the second fret. A classical guitar thankfully has room for that."}},
  "D":{full:{nl:"D majeur",en:"D major"},f:[X, X, 0, 2, 3, 2],g:[0, 0, 0, 1, 3, 2],tip:{nl:"Een driehoekje op de dunste drie snaren. Sla alleen de onderste vier snaren aan.",en:"A small triangle on the three thinnest strings. Strum only the bottom four strings."}},
  "Dm":{full:{nl:"D mineur",en:"D minor"},f:[X, X, 0, 2, 3, 1],g:[0, 0, 0, 2, 3, 1],tip:{nl:"Lijkt op D, maar de dunste snaar gaat een vakje terug. Klinkt meteen droeviger.",en:"Like D, but the thinnest string moves back one fret. It sounds sadder straight away."}},
  "C":{full:{nl:"C majeur",en:"C major"},f:[X, 3, 2, 0, 1, 0],g:[0, 3, 2, 0, 1, 0],tip:{nl:"Een trapje schuin omhoog. Buig je vingers goed bol zodat de losse snaren ertussen vrij blijven.",en:"A staircase going diagonally up. Arch your fingers well so the open strings between them stay clear."}},
  "G":{full:{nl:"G majeur",en:"G major"},f:[3, 2, 0, 0, 0, 3],g:[2, 1, 0, 0, 0, 3],tip:{nl:"Je hand spreidt over de hele hals: twee vingers bovenaan, je ringvinger helemaal onderaan.",en:"Your hand spans the whole neck: two fingers at the top, your ring finger all the way at the bottom."}},
  "A7":{full:{nl:"A septiem",en:"A seventh"},f:[X, 0, 2, 0, 2, 0],g:[0, 0, 1, 0, 2, 0],tip:{nl:"Het A-akkoord waar je de middelste vinger uit weghaalt. Wil graag naar D.",en:"The A chord with the middle finger taken out. Wants to go to D."}},
  "E7":{full:{nl:"E septiem",en:"E seventh"},f:[0, 2, 0, 1, 0, 0],g:[0, 2, 0, 1, 0, 0],tip:{nl:"E zonder je ringvinger. Twee vingers, zes snaren, en het wil terug naar A of Am.",en:"E without your ring finger. Two fingers, six strings, and it wants to return to A or Am."}},
  "D7":{full:{nl:"D septiem",en:"D seventh"},f:[X, X, 0, 2, 1, 2],g:[0, 0, 0, 2, 1, 3],tip:{nl:"De driehoek van D, maar gespiegeld. Leidt mooi naar G.",en:"The D triangle, mirrored. Leads nicely to G."}},
  "G7":{full:{nl:"G septiem",en:"G seventh"},f:[3, 2, 0, 0, 0, 1],g:[3, 2, 0, 0, 0, 1],tip:{nl:"Een lange schuine lijn over de hals. Wil graag naar C.",en:"One long diagonal line across the neck. Wants to go to C."}},
  "B7":{full:{nl:"B septiem",en:"B seventh"},f:[X, 2, 1, 2, 0, 2],g:[0, 2, 1, 3, 0, 4],tip:{nl:"Je eerste akkoord met vier vingers. De B-snaar blijft los. Hoort bij liedjes in E.",en:"Your first four-finger chord. The B string stays open. Belongs to songs in E."}},
  "Fmaj7":{full:{nl:"F majeur 7",en:"F major 7"},f:[X, X, 3, 2, 1, 0],g:[0, 0, 3, 2, 1, 0],tip:{nl:"De lichte versie van F, zonder barré. Een trapje op drie snaren, de dunste snaar blijft los.",en:"The light version of F, without a barre. A staircase on three strings, the thinnest string stays open."}},
  "F":{full:{nl:"F majeur",en:"F major"},f:[1, 3, 3, 2, 1, 1],g:[1, 3, 4, 2, 1, 1],barre:{fret:1,from:0,to:5},tip:{nl:"Het beruchte barré-akkoord: wijsvinger plat over alle snaren. Het duurt weken voor het schoon klinkt, bij iedereen.",en:"The notorious barre chord: index finger flat across all strings. It takes weeks to sound clean, for everyone."}},
  "Bm":{full:{nl:"B mineur",en:"B minor"},f:[X, 2, 4, 4, 3, 2],g:[0, 1, 3, 4, 2, 1],barre:{fret:2,from:1,to:5},tip:{nl:"De Am-vorm, twee vakjes opgeschoven, met je wijsvinger plat in het tweede vakje.",en:"The Am shape moved up two frets, with your index finger flat across the second fret."}}
};
var LEVELS=[
  {t:{nl:"Stap 1",en:"Step 1"},d:{nl:"Twee of drie vingers, veel losse snaren.",en:"Two or three fingers, lots of open strings."},c:["Em","E","Am","A"]},
  {t:{nl:"Stap 2",en:"Step 2"},d:{nl:"De rest van de kampvuurakkoorden.",en:"The rest of the campfire chords."},c:["D","Dm","C","G"]},
  {t:{nl:"Stap 3",en:"Step 3"},d:{nl:"Septiemakkoorden en de lichte F.",en:"Seventh chords and the light F."},c:["A7","E7","D7","G7","B7","Fmaj7"]},
  {t:{nl:"Stap 4",en:"Step 4"},d:{nl:"Barré-akkoorden: één vinger over alle snaren.",en:"Barre chords: one finger across all strings."},c:["F","Bm"]}
];
var PROGS=[

var ctx=null,chains=[],bufs={},voices=[];
function bq(type,freq,gain,q){var f=ctx.createBiquadFilter();f.type=type;f.frequency.value=freq;if(gain!=null)f.gain.value=gain;if(q!=null)f.Q.value=q;return f;}

function audio(){
  if(!ctx){
    try{
      var AC=window.AudioContext||window.webkitAudioContext;
      ctx=new AC();
      var comp=ctx.createDynamicsCompressor();comp.connect(ctx.destination);
      var g0=ctx.createGain(),g1=ctx.createGain(),g2=ctx.createGain(),g3=ctx.createGain();
      chains[0]=link([g0,bq("peaking",210,5,1),bq("lowpass",4800),comp]);
      chains[1]=link([g1,bq("highpass",75),bq("peaking",180,3,1),bq("highshelf",3200,4),bq("lowpass",10000),comp]);
      chains[2]=link([g2,bq("highpass",70),bq("peaking",750,4,0.8),bq("lowpass",4200),comp]);
      var ws=ctx.createWaveShaper(),curve=new Float32Array(1024),i;
      for(i=0;i<1024;i++){var x=i/511.5-1;curve[i]=Math.tanh(x*3.2);}
      ws.curve=curve;ws.oversample="2x";
      var pre=ctx.createGain();pre.gain.value=2.2;var post=ctx.createGain();post.gain.value=0.3;
      chains[3]=link([g3,bq("highpass",110),pre,ws,bq("peaking",900,3,0.8),bq("lowpass",3400),post,comp]);
    }catch(e){ctx=null;return false;}
  }

  return true;
}
function getBuf(midi,G){
  var key=G.sm+"|"+G.b+"|"+G.sus+"|"+midi;
  if(bufs[key])return bufs[key];
  var sr=ctx.sampleRate,f=440*Math.pow(2,(midi-69)/12),N=Math.max(2,Math.round(sr/f-G.b)),len=Math.floor(sr*Math.min(5,G.sus+0.6));
  var loss=Math.exp(-6.9/(f*G.sus)),ring=new Float32Array(N),i;
  for(i=0;i<N;i++)ring[i]=Math.random()*2-1;
  for(var p=0;p<G.sm;p++){var prev=ring[N-1];for(i=0;i<N;i++){var cur=ring[i];ring[i]=(prev+cur)/2;prev=cur;}}
  var b=ctx.createBuffer(1,len,sr),d=b.getChannelData(0),idx=0,peak=0,w=G.b;
  for(i=0;i<len;i++){
    var v=ring[idx];d[i]=v;if(Math.abs(v)>peak)peak=Math.abs(v);
    var nx=idx+1;if(nx===N)nx=0;ring[idx]=loss*((1-w)*ring[idx]+w*ring[nx]);idx=nx;
  }
  var fade=Math.floor(sr*0.2);

function pluck(s,t,vel,frets){
  if(frets[s]<0)return;
  if(!audio())return;
  var now=ctx.currentTime;if(t==null||t<now)t=now;
  var G=GUITARS[S.gtr],o=getBuf(OPEN[s]+frets[s],G);
  var src=ctx.createBufferSource();src.buffer=o.b;src.playbackRate.value=o.rate;
  var g=ctx.createGain();g.gain.value=G.vol*vel;
  src.connect(g);g.connect(chains[S.gtr]);
  var old=voices[s];
  if(old){try{old.g.gain.setTargetAtTime(0,t,0.008);old.src.stop(t+0.08);}catch(e){}}
  src.start(t);voices[s]={src:src,g:g};
  setTimeout(function(){ringString(s);},Math.max(0,(t-now)*1000));
}
function damp(s,t){var old=voices[s];if(old&&ctx){try{old.g.gain.setTargetAtTime(0,t,0.02);old.src.stop(t+0.2);}catch(e){}voices[s]=null;}}
function strum(dir,when,frets){
  if(!audio())return;
  frets=frets||CH[S.chord].f;
  var t0=(when==null)?ctx.currentTime:when,k=0;
  for(var i=0;i<NS;i++){
    var s=dir>0?i:NS-1-i;

    pluck(s,t0+k*0.017,dir>0?1:0.72,frets);k++;

  setTimeout(function(){btn.classList.add("hit");setTimeout(function(){btn.classList.remove("hit");},110);},Math.max(0,(t0-ctx.currentTime)*1000));
}

function buildPad(){
  var pad=$("pad");
  for(var s=0;s<NS;s++){
    var d=el("div","string"+(s<3?" bass":""));d.style.top=POS[s]+"%";
    var b=el("b",null,SNAMES[s]);var i=el("i");i.style.height=THICK[s]+"px";var em=el("em");
    d.appendChild(b);d.appendChild(i);d.appendChild(em);pad.appendChild(d);strEls.push(d);
  }
  var lastY=null;
  function ys(){var r=pad.getBoundingClientRect();return POS.map(function(p){return r.top+r.height*p/100;});}
  pad.addEventListener("pointerdown",function(e){
    e.preventDefault();try{pad.setPointerCapture(e.pointerId);}catch(x){}
    lastY=e.clientY;var y=ys();
    for(var s=0;s<NS;s++){if(Math.abs(y[s]-e.clientY)<13){pluck(s,null,1,CH[S.chord].f);break;}}
  });
  pad.addEventListener("pointermove",function(e){
    if(lastY==null)return;
    var y=ys(),a=lastY,b=e.clientY;if(a===b)return;
    var hit=[];
    for(var s=0;s<NS;s++){if((y[s]>a&&y[s]<=b)||(y[s]<a&&y[s]>=b))hit.push(s);}
    if(b<a)hit.reverse();
    for(var i=0;i<hit.length;i++)pluck(hit[i],ctx?ctx.currentTime+i*0.012:null,b>a?1:0.75,CH[S.chord].f);

  pad.addEventListener("pointerup",end);pad.addEventListener("pointercancel",end);
}

function diagram(name){
  var c=CH[name],top=42,fh=44,rows=4,ns="http://www.w3.org/2000/svg",XS=[];
  for(var k=0;k<NS;k++)XS.push(40+k*31);

  svg.setAttribute("role","img");svg.setAttribute("aria-label",t("dia")+" "+name);
  function add(tag,attrs,txt){var e=document.createElementNS(ns,tag);for(var a in attrs)e.setAttribute(a,attrs[a]);if(txt!=null)e.textContent=txt;svg.appendChild(e);return e;}
  var i;
  for(i=0;i<NS;i++)add("line",{x1:XS[i],y1:top,x2:XS[i],y2:top+fh*rows,"class":"grid-l"});
  for(i=1;i<=rows;i++){add("line",{x1:XS[0],y1:top+fh*i,x2:XS[NS-1],y2:top+fh*i,"class":"grid-l"});add("text",{x:22,y:top+fh*(i-0.5),"class":"fr"},String(i));}
  add("line",{x1:XS[0],y1:top,x2:XS[NS-1],y2:top,"class":"nut"});
  if(c.barre){var y=top+fh*(c.barre.fret-0.5);add("rect",{x:XS[c.barre.from]-13,y:y-13,width:XS[c.barre.to]-XS[c.barre.from]+26,height:26,rx:13,"class":"barre"});}
  for(i=0;i<NS;i++){
    if(c.f[i]<0){add("line",{x1:XS[i]-6,y1:14,x2:XS[i]+6,y2:26,"class":"x"});add("line",{x1:XS[i]+6,y1:14,x2:XS[i]-6,y2:26,"class":"x"});}
    else if(c.f[i]===0){add("circle",{cx:XS[i],cy:20,r:7,"class":"open"});}
    else{var cy=top+fh*(c.f[i]-0.5);add("circle",{cx:XS[i],cy:cy,r:13,"class":"dot"});add("text",{x:XS[i],y:cy+1,"class":"fn"},String(c.g[i]));}
    add("text",{x:XS[i],y:top+fh*rows+26,"class":"lbl"},SNAMES[i]);
  }
  return svg;
}

  while(nextT<ctx.currentTime+0.12){
    if(step===0){
      if(S.auto&&!firstBar){var pc=PROGS[S.prog].c;S.pos=(S.pos+1)%pc.length;S.chord=pc[S.pos];}
      firstBar=false;
    }
    var ch=PATS[S.pat].s.charAt(step),frets=CH[S.chord].f;
    if(ch==="D")strum(1,nextT,frets);else if(ch==="U")strum(-1,nextT,frets);
    if(ch!=="-"&&PATS[S.pat].chop)chop(nextT+0.15);

      if(!playing)return;markStep(st);if(st===0)renderChord();

  $("pats").addEventListener("click",function(e){var b=e.target.closest(".pat");if(!b)return;S.pat=+b.dataset.i;renderSteps(-1);save();});
  $("btnDown").addEventListener("pointerdown",function(e){e.preventDefault();strum(1);});
  $("btnUp").addEventListener("pointerdown",function(e){e.preventDefault();strum(-1);});
  $("btnDown").addEventListener("click",function(e){if(e.detail===0)strum(1);});
  $("btnUp").addEventListener("click",function(e){if(e.detail===0)strum(-1);});
  $("play").addEventListener("click",function(){playing?stop():start();});
  $("bpm").addEventListener("input",function(){S.bpm=+this.value;$("bpmOut").textContent=S.bpm+" bpm";save();});
  $("autoSwitch").addEventListener("change",function(){S.auto=this.checked;save();});
  document.addEventListener("keydown",function(e){
    if(e.repeat||e.metaKey||e.ctrlKey||e.altKey)return;
    var tag=(e.target.tagName||"").toLowerCase();
    if(e.key==="ArrowDown"){if(tag==="input")return;e.preventDefault();strum(1);}
    else if(e.key==="ArrowUp"){if(tag==="input")return;e.preventDefault();strum(-1);}
    else if(e.key===" "){if(tag==="button"||tag==="input")return;e.preventDefault();playing?stop():start();}
    else if(e.key>="1"&&e.key<="4"){var pc=PROGS[S.prog].c,k=+e.key-1;if(pc[k])setChord(pc[k],k);}
  });
  try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(function(){return S;});}catch(e){}
}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);
else boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>
</body>
</html>
